name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build CinePlayer iOS v1.0.1 (Unsigned IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout CinePlayer v1.0.1
        uses: actions/checkout@v4
        with:
          ref: v1.0.1

      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          BEST_XCODE=$(python3 -c 'import glob,os,re; c=sorted(glob.glob("/Applications/Xcode*.app")); print(max(c, key=lambda p:(1 if re.findall(r"\d+",os.path.basename(p)) else 0, [int(x) for x in re.findall(r"\d+",os.path.basename(p))], os.path.basename(p))))')
          echo "Selecting Xcode: $BEST_XCODE"
          sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Download and extract v1.0.0 Frameworks.zip
        run: |
          curl --fail --location -o Frameworks.zip https://github.com/cinemore/CinePlayer/releases/download/v1.0.0/Frameworks.zip
          unzip -q Frameworks.zip
          if [ ! -d Frameworks ]; then
            mkdir -p Frameworks
            mv *.xcframework Frameworks/
          fi
          ls -la Frameworks
          test -d Frameworks/CinePlayerSDK.xcframework

      - name: Patch v1.0.1 iOS build compatibility
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 -c '
          import pathlib, plistlib
          for p in [
            pathlib.Path("CinePlayer.xcodeproj/project.pbxproj"),
            pathlib.Path("CinePlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"),
          ]:
            if p.exists():
              txt = p.read_text(encoding="utf-8")
              new = txt.replace("git@github.com:", "https://github.com/")
              if new != txt:
                p.write_text(new, encoding="utf-8")
                print("Rewrote SSH URLs in", p)
          pem = pathlib.Path("CinePlayer/Player/Model/PlayerEnhancementModel.swift")
          s = pem.read_text(encoding="utf-8")
          target = "        currentRifeTier = nil"
          assert s.count(target) == 1, f"unexpected count: {s.count(target)}"
          pem.write_text(
            s.replace(target, "        #if os(macOS)\n        currentRifeTier = nil\n        #endif", 1),
            encoding="utf-8",
          )
          print("Patched currentRifeTier in", pem)

          pov = pathlib.Path("CinePlayer/Player/Views/PlayerOpenView.swift")
          ps = pov.read_text(encoding="utf-8")
          t_ut = "            allowedContentTypes: [.movie, .video],"
          assert ps.count(t_ut) == 1, f"unexpected allowedContentTypes count: {ps.count(t_ut)}"
          ps = ps.replace(t_ut, "            allowedContentTypes: [.item],", 1)
          t_cb = "            if case .success(let urls) = result, let url = urls.first {\n                openMedia(url: url)\n            }"
          assert ps.count(t_cb) == 1, f"unexpected fileImporter callback count: {ps.count(t_cb)}"
          r_cb = "            if case .success(let urls) = result, let url = urls.first {\n                Task { @MainActor in\n                    try? await Task.sleep(for: .milliseconds(450))\n                    openMedia(url: url)\n                }\n            }"
          ps = ps.replace(t_cb, r_cb, 1)
          pov.write_text(ps, encoding="utf-8")
          print("Patched PlayerOpenView.swift")

          pss = pathlib.Path("CinePlayer/Player/Model/PlayerSessionStore.swift")
          ss = pss.read_text(encoding="utf-8")
          t_sec = "\n".join([
            "            let hasSecurityAccess = fileURL.startAccessingSecurityScopedResource()",
            "            let isReadable =",
            "                FileManager.default.fileExists(atPath: fileURL.path)",
            "                    && FileManager.default.isReadableFile(atPath: fileURL.path)",
            "",
            "            guard isReadable else {",
            "                if hasSecurityAccess {",
            "                    fileURL.stopAccessingSecurityScopedResource()",
            "                }",
            "                continue",
            "            }",
            "",
            "            if hasSecurityAccess {",
            "                secured.append(fileURL)",
            "            }",
            "            result.append(source)",
          ])
          assert ss.count(t_sec) == 1, f"unexpected PlayerSessionStore block count: {ss.count(t_sec)}"
          r_sec = "\n".join([
            "            let hasSecurityAccess = fileURL.startAccessingSecurityScopedResource()",
            "            var resolvedURL = fileURL",
            "            var isReadable =",
            "                FileManager.default.fileExists(atPath: resolvedURL.path)",
            "                    && FileManager.default.isReadableFile(atPath: resolvedURL.path)",
            "",
            "            if !isReadable {",
            "                resolvedURL = Self.coordinateReadableURL(fileURL)",
            "                isReadable =",
            "                    FileManager.default.fileExists(atPath: resolvedURL.path)",
            "                        && FileManager.default.isReadableFile(atPath: resolvedURL.path)",
            "            }",
            "",
            "            guard hasSecurityAccess || isReadable else {",
            "                continue",
            "            }",
            "",
            "            if hasSecurityAccess {",
            "                secured.append(fileURL)",
            "            }",
            "            let effectiveSource =",
            "                resolvedURL == fileURL",
            "                    ? source",
            "                    : PlayerSource(url: resolvedURL, startTime: source.startTime)",
            "            result.append(effectiveSource)",
          ])
          ss = ss.replace(t_sec, r_sec, 1)
          t_end = "    private func releaseSecurityScopedURLs() {"
          assert ss.count(t_end) == 1, f"unexpected releaseSecurityScopedURLs count: {ss.count(t_end)}"
          r_end = "\n".join([
            "    nonisolated private static func coordinateReadableURL(_ url: URL) -> URL {",
            "        var resolvedURL = url",
            "        var coordError: NSError?",
            "        NSFileCoordinator().coordinate(readingItemAt: url, options: [], error: &coordError) { newURL in",
            "            resolvedURL = newURL",
            "        }",
            "        return resolvedURL",
            "    }",
            "",
            "    private func releaseSecurityScopedURLs() {",
          ])
          ss = ss.replace(t_end, r_end, 1)
          pss.write_text(ss, encoding="utf-8")
          print("Patched PlayerSessionStore.swift")

          ip = pathlib.Path("CinePlayer/Info.plist")
          with ip.open("rb") as f:
            pl = plistlib.load(f)
          pl["UIFileSharingEnabled"] = True
          with ip.open("wb") as f:
            plistlib.dump(pl, f)
          print("Patched Info.plist UIFileSharingEnabled=True")
          app_path = pathlib.Path("CinePlayer/CinePlayerApp.swift")
          app_txt = app_path.read_text(encoding="utf-8")
          if "import Foundation" not in app_txt:
            app_txt = "import Foundation\n" + app_txt
          t_app = "\n".join([
            "            #else",
            "                .onOpenURL { url in",
            "                    if url.isFileURL {",
            "                        sessionStore.open(url: url)",
            "                    }",
            "                }",
            "            #endif",
          ])
          assert app_txt.count(t_app) == 1, f"unexpected CinePlayerApp.swift block count: {app_txt.count(t_app)}"
          r_app = "\n".join([
            "            #else",
            "                .onOpenURL { url in",
            "                    if url.isFileURL {",
            "                        sessionStore.open(url: url)",
            "                    }",
            "                    #if DEBUG",
            "                    if !url.isFileURL,",
            "                       url.scheme == \"cineplayer\",",
            "                       url.host(percentEncoded: false) == \"smoke\",",
            "                       let components = URLComponents(url: url, resolvingAgainstBaseURL: false),",
            "                       let name = components.queryItems?.first(where: { $0.name == \"file\" })?.value,",
            "                       !name.isEmpty,",
            "                       let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first",
            "                    {",
            "                        let targetURL = docs.appendingPathComponent((name as NSString).lastPathComponent)",
            "                        sessionStore.open(url: targetURL)",
            "                    }",
            "                    #endif",
            "                }",
            "                #if DEBUG",
            "                .task {",
            "                    guard sessionStore.currentSource == nil,",
            "                          let name = UserDefaults.standard.string(forKey: \"smokeFile\"),",
            "                          !name.isEmpty,",
            "                          let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first",
            "                    else { return }",
            "                    try? await Task.sleep(for: .milliseconds(500))",
            "                    let targetURL = docs.appendingPathComponent((name as NSString).lastPathComponent)",
            "                    sessionStore.open(url: targetURL)",
            "                }",
            "                #endif",
            "            #endif",
          ])
          app_path.write_text(app_txt.replace(t_app, r_app, 1), encoding="utf-8")
          print("Patched CinePlayerApp.swift DEBUG cineplayer://smoke hook")
          '

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project CinePlayer.xcodeproj -scheme CinePlayer -skipPackagePluginValidation -skipMacroValidation

      - name: Run iOS Simulator smoke test (launch & open local video)
        run: |
          set -euo pipefail
          mkdir -p sim-smoke-report

          {
            echo "=== Frameworks/*.xcframework ==="
            ls -la Frameworks/*.xcframework || true
            echo "=== CinePlayerSDK.xcframework/Info.plist ==="
            cat Frameworks/CinePlayerSDK.xcframework/Info.plist || true
          } > sim-smoke-report/arch.log 2>&1

          HAS_SIM_SLICE=$(python3 -c '
          import glob, os, plistlib
          p = "Frameworks/CinePlayerSDK.xcframework/Info.plist"
          found = False
          if os.path.exists(p):
              with open(p, "rb") as f:
                  pl = plistlib.load(f)
              for item in pl.get("AvailableLibraries", []):
                  if item.get("SupportedPlatformVariant") == "simulator" or "simulator" in item.get("LibraryIdentifier", "").lower():
                      found = True
                      break
          if not found and glob.glob("Frameworks/CinePlayerSDK.xcframework/*simulator*"):
              found = True
          print("1" if found else "0")
          ')

          if [ "$HAS_SIM_SLICE" != "1" ]; then
            echo "CinePlayerSDK.xcframework has no iOS Simulator slice; skipping simulator smoke test." | tee sim-smoke-report/launch.log sim-smoke-report/process.log
            echo "::warning::CinePlayerSDK.xcframework has no iOS Simulator slice; skipping simulator smoke test"
            exit 0
          fi

          SIM_UDID=$(python3 -c '
          import json, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devs in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              rt_nums = [int(x) for x in re.findall(r"\d+", runtime)]
              for d in devs:
                  name = d.get("name", "")
                  if d.get("isAvailable") and "iPhone" in name:
                      dev_nums = [int(x) for x in re.findall(r"\d+", name)]
                      score = (rt_nums, dev_nums, 1 if "Pro" in name else 0, name)
                      candidates.append((score, d["udid"], name, runtime))
          candidates.sort(reverse=True)
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          best = candidates[0]
          print(f"Selected simulator: {best[2]} ({best[3]}) UDID={best[1]}", file=sys.stderr)
          print(best[1])
          ')

          xcodebuild \
            -project CinePlayer.xcodeproj \
            -scheme CinePlayer \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build \
            SYMROOT="$PWD/build-sim"

          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="build-sim/Debug-iphonesimulator/CinePlayer.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID" | tee sim-smoke-report/launch.log

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" >> sim-smoke-report/launch.log 2>&1
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot sim-smoke-report/sim-01-launch.png

          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=30 -t 10 -c:v libx264 -pix_fmt yuv420p smoke.mp4
          else
            swift - <<'SWIFT'
          import AVFoundation
          import CoreMedia
          import CoreVideo
          import Dispatch
          import Foundation

          let outURL = URL(fileURLWithPath: FileManager.default.currentDirectoryPath).appendingPathComponent("smoke.mp4")
          try? FileManager.default.removeItem(at: outURL)
          let writer = try AVAssetWriter(outputURL: outURL, fileType: .mp4)
          let settings: [String: Any] = [
              AVVideoCodecKey: AVVideoCodecType.h264,
              AVVideoWidthKey: 320,
              AVVideoHeightKey: 240,
          ]
          let input = AVAssetWriterInput(mediaType: .video, outputSettings: settings)
          let adaptor = AVAssetWriterInputPixelBufferAdaptor(
              assetWriterInput: input,
              sourcePixelBufferAttributes: [
                  kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32ARGB,
                  kCVPixelBufferWidthKey as String: 320,
                  kCVPixelBufferHeightKey as String: 240,
              ]
          )
          writer.add(input)
          writer.startWriting()
          writer.startSession(atSourceTime: .zero)
          for frame in 0..<150 {
              while !input.isReadyForMoreMediaData { Thread.sleep(forTimeInterval: 0.005) }
              var pb: CVPixelBuffer?
              CVPixelBufferCreate(kCFAllocatorDefault, 320, 240, kCVPixelFormatType_32ARGB, nil, &pb)
              if let pb {
                  CVPixelBufferLockBaseAddress(pb, [])
                  if let base = CVPixelBufferGetBaseAddress(pb) {
                      let bytes = base.assumingMemoryBound(to: UInt8.self)
                      let bpr = CVPixelBufferGetBytesPerRow(pb)
                      for y in 0..<240 {
                          for x in 0..<320 {
                              let off = y * bpr + x * 4
                              bytes[off] = 255
                              bytes[off + 1] = UInt8((x + frame * 4) % 256)
                              bytes[off + 2] = UInt8((y + frame * 2) % 256)
                              bytes[off + 3] = 180
                          }
                      }
                  }
                  CVPixelBufferUnlockBaseAddress(pb, [])
                  adaptor.append(pb, withPresentationTime: CMTime(value: Int64(frame), timescale: 15))
              }
          }
          input.markAsFinished()
          let sem = DispatchSemaphore(value: 0)
          writer.finishWriting { sem.signal() }
          sem.wait()
          guard writer.status == .completed else {
              fatalError("AVAssetWriter failed: \(String(describing: writer.error))")
          }
          print("Generated smoke.mp4 via AVAssetWriter")
          SWIFT
          fi

          DATA_DIR=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data)
          mkdir -p "$DATA_DIR/Documents"
          cp smoke.mp4 "$DATA_DIR/Documents/smoke.mp4"
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -smokeFile smoke.mp4 > sim-smoke-report/openurl.log 2>&1
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot sim-smoke-report/sim-02-open-local-video.png

          xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --predicate 'process == "CinePlayer"' 2>&1 | tail -n 200 > sim-smoke-report/app.log || true

          {
            echo "=== simctl launchctl list ==="
            xcrun simctl spawn "$SIM_UDID" launchctl list | grep -i cineplayer || true
            echo "=== pgrep -fl CinePlayer ==="
            pgrep -fl CinePlayer || true
            echo "=== ps aux CinePlayer ==="
            ps aux | grep -i "[C]inePlayer" || true
            echo "=== DiagnosticReports ==="
            ls -la ~/Library/Logs/DiagnosticReports/*CinePlayer* 2>/dev/null || true
          } > sim-smoke-report/process.log 2>&1
          cp ~/Library/Logs/DiagnosticReports/*CinePlayer* sim-smoke-report/ 2>/dev/null || true

          if ! pgrep -f "CinePlayer.app/CinePlayer" >/dev/null 2>&1; then
            echo "CinePlayer process is not running after smoke test!" | tee -a sim-smoke-report/process.log
            exit 1
          fi

      - name: Upload Simulator smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CinePlayer-sim-smoke-report
          path: sim-smoke-report
          retention-days: 30

      - name: Build unsigned Release iOS app
        run: |
          xcodebuild \
            -project CinePlayer.xcodeproj \
            -scheme CinePlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT="$PWD/build"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CinePlayer.app Payload/
          ls -la Payload/CinePlayer.app/Frameworks || true
          zip -qry "CinePlayer-v1.0.1-b${{ github.run_number }}-unsigned.ipa" Payload
          ls -lh CinePlayer-v1.0.1-b*-unsigned.ipa

      - name: Upload CinePlayer-unsigned-ipa
        uses: actions/upload-artifact@v4
        with:
          name: CinePlayer-unsigned-ipa
          path: CinePlayer-v*-unsigned.ipa
          retention-days: 30
