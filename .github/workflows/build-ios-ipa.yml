name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build CinePlayer iOS v1.0.1 (Unsigned IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout CinePlayer v1.0.1
        uses: actions/checkout@v4
        with:
          ref: v1.0.1

      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          BEST_XCODE=$(python3 -c 'import glob,os,re; c=sorted(glob.glob("/Applications/Xcode*.app")); print(max(c, key=lambda p:(1 if re.findall(r"\d+",os.path.basename(p)) else 0, [int(x) for x in re.findall(r"\d+",os.path.basename(p))], os.path.basename(p))))')
          echo "Selecting Xcode: $BEST_XCODE"
          sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Download and extract v1.0.0 Frameworks.zip
        run: |
          curl --fail --location -o Frameworks.zip https://github.com/cinemore/CinePlayer/releases/download/v1.0.0/Frameworks.zip
          unzip -q Frameworks.zip
          if [ ! -d Frameworks ]; then
            mkdir -p Frameworks
            mv *.xcframework Frameworks/
          fi
          ls -la Frameworks
          test -d Frameworks/CinePlayerSDK.xcframework

      - name: Patch v1.0.1 iOS build compatibility
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          python3 -c '
          import pathlib, plistlib
          for p in [
            pathlib.Path("CinePlayer.xcodeproj/project.pbxproj"),
            pathlib.Path("CinePlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"),
          ]:
            if p.exists():
              txt = p.read_text(encoding="utf-8")
              new = txt.replace("git@github.com:", "https://github.com/")
              if new != txt:
                p.write_text(new, encoding="utf-8")
                print("Rewrote SSH URLs in", p)

          pem = pathlib.Path("CinePlayer/Player/Model/PlayerEnhancementModel.swift")
          s = pem.read_text(encoding="utf-8")
          target = "        currentRifeTier = nil"
          assert s.count(target) == 1, f"unexpected count: {s.count(target)}"
          pem.write_text(
            s.replace(target, "        #if os(macOS)\n        currentRifeTier = nil\n        #endif", 1),
            encoding="utf-8",
          )
          print("Patched currentRifeTier in", pem)

          pov = pathlib.Path("CinePlayer/Player/Views/PlayerOpenView.swift")
          ps = pov.read_text(encoding="utf-8")

          t_imp = """#if os(macOS)
              import AppKit
          #else
              import UIKit
          #endif"""
          assert ps.count(t_imp) == 1, f"unexpected import block count: {ps.count(t_imp)}"
          r_imp = """#if os(macOS)
              import AppKit
          #else
              import UIKit
          #endif
          #if os(iOS)
              import CoreTransferable
              import PhotosUI
          #endif"""
          ps = ps.replace(t_imp, r_imp, 1)

          t_state = "    @State private var showFileImporter = false"
          assert ps.count(t_state) == 1, f"unexpected showFileImporter state count: {ps.count(t_state)}"
          r_state = """    @State private var showFileImporter = false
              #if os(iOS)
                  @State private var pendingPickedURL: URL?
                  @State private var selectedPhotoItem: PhotosPickerItem?
                  @State private var isImportingPhoto = false
                  @State private var openErrorMessage: String?
              #endif"""
          ps = ps.replace(t_state, r_state, 1)

          t_fi = """        .fileImporter(
                      isPresented: $showFileImporter,
                      allowedContentTypes: [.movie, .video],
                      allowsMultipleSelection: false
                  ) { result in
                      if case .success(let urls) = result, let url = urls.first {
                          openMedia(url: url)
                      }
                  }"""
          assert ps.count(t_fi) == 1, f"unexpected fileImporter block count: {ps.count(t_fi)}"
          r_fi = """        #if os(iOS)
                  .sheet(isPresented: $showFileImporter, onDismiss: handlePendingPickedFile) {
                      IOSDocumentPickerView(
                          onPick: { pickedURL in
                              pendingPickedURL = pickedURL
                              showFileImporter = false
                          },
                          onCancel: {
                              showFileImporter = false
                          },
                          onError: { message in
                              openErrorMessage = message
                              showFileImporter = false
                          }
                      )
                      .ignoresSafeArea()
                  }
                  .compatibleOnChange(of: selectedPhotoItem) { newItem in
                      guard let newItem else { return }
                      selectedPhotoItem = nil
                      importFromPhotosItem(newItem)
                  }
                  .alert(
                      "无法打开视频",
                      isPresented: Binding(
                          get: { activeOpenErrorMessage != nil },
                          set: { isPresented in
                              if !isPresented {
                                  openErrorMessage = nil
                                  sessionStore.lastOpenError = nil
                              }
                          }
                      )
                  ) {
                      Button("确定", role: .cancel) {}
                  } message: {
                      Text(activeOpenErrorMessage ?? "")
                  }
                  #else
                  .fileImporter(
                      isPresented: $showFileImporter,
                      allowedContentTypes: [.movie, .video, .audiovisualContent, .data],
                      allowsMultipleSelection: false
                  ) { result in
                      if case .success(let urls) = result, let url = urls.first {
                          openMedia(url: url)
                      }
                  }
                  #endif"""
          ps = ps.replace(t_fi, r_fi, 1)

          t_btn = """    private var openFileButton: some View {
                  Button(action: {
                      showFileImporter = true
                  }) {
                      ZStack {
                          Color.blue
                          Text("打开文件")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundStyle(.white)
                      }
                      .frame(width: 240, height: 44)
                      .modifier(
                          GlassEffectModifier(
                              cornerRadius: Self.openControlCornerRadius,
                              useCapsule: true,
                              clipsContent: true
                          )
                      )
                  }
                  .buttonStyle(.plain)
              }"""
          assert ps.count(t_btn) == 1, f"unexpected openFileButton block count: {ps.count(t_btn)}"
          r_btn = """    private var openFileButton: some View {
                  VStack(spacing: 12) {
                      Button(action: {
                          showFileImporter = true
                      }) {
                          ZStack {
                              Color.blue
                              Text("打开文件")
                                  .font(.system(size: 15, weight: .semibold))
                                  .foregroundStyle(.white)
                          }
                          .frame(width: 240, height: 44)
                          .modifier(
                              GlassEffectModifier(
                                  cornerRadius: Self.openControlCornerRadius,
                                  useCapsule: true,
                                  clipsContent: true
                              )
                          )
                      }
                      .buttonStyle(.plain)

                      #if os(iOS)
                          PhotosPicker(selection: $selectedPhotoItem, matching: .videos, photoLibrary: .shared()) {
                              ZStack {
                                  Color.indigo
                                  if isImportingPhoto {
                                      HStack(spacing: 8) {
                                          ProgressView()
                                              .tint(.white)
                                          Text("正在导入相册视频…")
                                              .font(.system(size: 15, weight: .semibold))
                                              .foregroundStyle(.white)
                                      }
                                  } else {
                                      Label("从相册选择", systemImage: "photo.on.rectangle.angled")
                                          .font(.system(size: 15, weight: .semibold))
                                          .foregroundStyle(.white)
                                  }
                              }
                              .frame(width: 240, height: 44)
                              .modifier(
                                  GlassEffectModifier(
                                      cornerRadius: Self.openControlCornerRadius,
                                      useCapsule: true,
                                      clipsContent: true
                                  )
                              )
                          }
                          .buttonStyle(.plain)
                          .disabled(isImportingPhoto)
                      #endif
                  }
              }"""
          ps = ps.replace(t_btn, r_btn, 1)

          t_open = """    private func openMedia(url: URL) {
                  #if os(tvOS)
                      isURLFieldFocused = false
                  #endif
                  sessionStore.open(url: url)
              }"""
          assert ps.count(t_open) == 1, f"unexpected openMedia block count: {ps.count(t_open)}"
          r_open = r"""    #if os(iOS)
                  private var activeOpenErrorMessage: String? {
                      openErrorMessage ?? sessionStore.lastOpenError
                  }

                  private func handlePendingPickedFile() {
                      guard let pickedURL = pendingPickedURL else { return }
                      pendingPickedURL = nil
                      Task { @MainActor in
                          try? await Task.sleep(for: .milliseconds(150))
                          do {
                              let stagedURL = try stageCinePlayerImportedFile(from: pickedURL)
                              openMedia(url: stagedURL)
                          } catch {
                              openErrorMessage = "无法读取本地视频：\(error.localizedDescription)"
                          }
                      }
                  }

                  private func importFromPhotosItem(_ item: PhotosPickerItem) {
                      guard !isImportingPhoto else { return }
                      isImportingPhoto = true
                      openErrorMessage = nil
                      Task { @MainActor in
                          defer { isImportingPhoto = false }
                          do {
                              guard let movie = try await item.loadTransferable(type: CinePlayerMovieTransferable.self) else {
                                  openErrorMessage = "未能从系统相册读取该视频（请确认 iCloud 原片已下载到本地）。"
                                  return
                              }
                              try? await Task.sleep(for: .milliseconds(150))
                              openMedia(url: movie.url)
                          } catch {
                              openErrorMessage = "相册视频导入失败：\(error.localizedDescription)"
                          }
                      }
                  }
              #endif

              private func openMedia(url: URL) {
                  #if os(tvOS)
                      isURLFieldFocused = false
                  #endif
                  sessionStore.open(url: url)
              }"""
          ps = ps.replace(t_open, r_open, 1)

          ios_helpers = r"""

          #if os(iOS)
          private var cinePlayerImportsDirectory: URL {
              FileManager.default.temporaryDirectory.appendingPathComponent("CinePlayerImports", isDirectory: true)
          }

          private func sanitizeCinePlayerFilename(_ raw: String) -> String {
              let disallowed = CharacterSet(charactersIn: "/\\:#?%\"<>|*")
              let joined = raw.components(separatedBy: disallowed).filter { !$0.isEmpty }.joined(separator: "_")
              let trimmed = joined.trimmingCharacters(in: .whitespacesAndNewlines)
              return trimmed.isEmpty ? "video" : String(trimmed.prefix(80))
          }

          private func pruneCinePlayerImports(keepingLatest limit: Int) {
              guard let entries = try? FileManager.default.contentsOfDirectory(
                  at: cinePlayerImportsDirectory,
                  includingPropertiesForKeys: [.contentModificationDateKey],
                  options: [.skipsHiddenFiles]
              ), entries.count > limit else {
                  return
              }
              let sorted = entries.sorted { lhs, rhs in
                  let lDate = (try? lhs.resourceValues(forKeys: [.contentModificationDateKey]).contentModificationDate) ?? .distantPast
                  let rDate = (try? rhs.resourceValues(forKeys: [.contentModificationDateKey]).contentModificationDate) ?? .distantPast
                  return lDate > rDate
              }
              for obsolete in sorted.dropFirst(limit) {
                  try? FileManager.default.removeItem(at: obsolete)
              }
          }

          private func stageCinePlayerImportedFile(from sourceURL: URL) throws -> URL {
              let standardizedImports = cinePlayerImportsDirectory.standardizedFileURL.path
              if sourceURL.standardizedFileURL.path.hasPrefix(standardizedImports),
                 FileManager.default.isReadableFile(atPath: sourceURL.path) {
                  return sourceURL
              }

              try FileManager.default.createDirectory(at: cinePlayerImportsDirectory, withIntermediateDirectories: true)
              pruneCinePlayerImports(keepingLatest: 3)

              let didAccess = sourceURL.startAccessingSecurityScopedResource()
              defer {
                  if didAccess {
                      sourceURL.stopAccessingSecurityScopedResource()
                  }
              }

              let ext = sourceURL.pathExtension
              let rawBase = sourceURL.deletingPathExtension().lastPathComponent
              let sanitizedBase = sanitizeCinePlayerFilename(rawBase)
              let prefix = String(UUID().uuidString.prefix(8))
              let filename = ext.isEmpty ? "\(prefix)_\(sanitizedBase)" : "\(prefix)_\(sanitizedBase).\(ext)"
              let destURL = cinePlayerImportsDirectory.appendingPathComponent(filename)

              if FileManager.default.fileExists(atPath: destURL.path) {
                  try FileManager.default.removeItem(at: destURL)
              }

              var coordinatorError: NSError?
              var copyError: Error?
              NSFileCoordinator().coordinate(readingItemAt: sourceURL, options: .withoutChanges, error: &coordinatorError) { readableURL in
                  do {
                      try FileManager.default.copyItem(at: readableURL, to: destURL)
                  } catch {
                      copyError = error
                  }
              }
              if let coordinatorError {
                  throw coordinatorError
              }
              if let copyError {
                  throw copyError
              }
              guard FileManager.default.isReadableFile(atPath: destURL.path) else {
                  throw NSError(
                      domain: "CinePlayer.LocalImport",
                      code: -1,
                      userInfo: [NSLocalizedDescriptionKey: "导入后的视频副本不可读：\(destURL.lastPathComponent)"]
                  )
              }
              return destURL
          }

          private struct IOSDocumentPickerView: UIViewControllerRepresentable {
              let onPick: (URL) -> Void
              let onCancel: () -> Void
              let onError: (String) -> Void

              func makeCoordinator() -> Coordinator {
                  Coordinator(onPick: onPick, onCancel: onCancel, onError: onError)
              }

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(
                      forOpeningContentTypes: [.movie, .video, .audiovisualContent, .data],
                      asCopy: true
                  )
                  picker.allowsMultipleSelection = false
                  picker.shouldShowFileExtensions = true
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {
                  context.coordinator.onPick = onPick
                  context.coordinator.onCancel = onCancel
                  context.coordinator.onError = onError
              }

              @MainActor
              final class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var onPick: (URL) -> Void
                  var onCancel: () -> Void
                  var onError: (String) -> Void

                  init(
                      onPick: @escaping (URL) -> Void,
                      onCancel: @escaping () -> Void,
                      onError: @escaping (String) -> Void
                  ) {
                      self.onPick = onPick
                      self.onCancel = onCancel
                      self.onError = onError
                  }

                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let firstURL = urls.first else {
                          onError("未获取到所选视频文件。")
                          return
                      }
                      do {
                          let stagedURL = try stageCinePlayerImportedFile(from: firstURL)
                          onPick(stagedURL)
                      } catch {
                          onError("无法读取所选文件：\(error.localizedDescription)")
                      }
                  }

                  func documentPickerWasCancelled(_ controller: UIDocumentPickerViewController) {
                      onCancel()
                  }
              }
          }

          private struct CinePlayerMovieTransferable: Transferable, Sendable {
              let url: URL

              static var transferRepresentation: some TransferRepresentation {
                  FileRepresentation(contentType: .movie) { movie in
                      SentTransferredFile(movie.url)
                  } importing: { received in
                      let stagedURL = try stageCinePlayerImportedFile(from: received.file)
                      return CinePlayerMovieTransferable(url: stagedURL)
                  }

                  FileRepresentation(contentType: .video) { movie in
                      SentTransferredFile(movie.url)
                  } importing: { received in
                      let stagedURL = try stageCinePlayerImportedFile(from: received.file)
                      return CinePlayerMovieTransferable(url: stagedURL)
                  }
              }
          }
          #endif
          """
          ps = ps.rstrip() + ios_helpers
          pov.write_text(ps, encoding="utf-8")
          print("Patched PlayerOpenView.swift")

          pss = pathlib.Path("CinePlayer/Player/Model/PlayerSessionStore.swift")
          ss = pss.read_text(encoding="utf-8")
          t_pub = "    @Published var currentSource: PlayerSource?"
          assert ss.count(t_pub) == 1, f"unexpected currentSource count: {ss.count(t_pub)}"
          r_pub = "    @Published var currentSource: PlayerSource?\n    @Published var lastOpenError: String?"
          ss = ss.replace(t_pub, r_pub, 1)

          t_open_fn = """    func open(sources: [PlayerSource], startAt: Int = 0) {
                  releaseSecurityScopedURLs()

                  let preparedSources = prepareSourcesForPlayback(sources)
                  guard !preparedSources.isEmpty else {
                      close()
                      return
                  }"""
          assert ss.count(t_open_fn) == 1, f"unexpected open(sources:) count: {ss.count(t_open_fn)}"
          r_open_fn = r"""    func open(sources: [PlayerSource], startAt: Int = 0) {
                  lastOpenError = nil
                  releaseSecurityScopedURLs()

                  let preparedSources = prepareSourcesForPlayback(sources)
                  guard !preparedSources.isEmpty else {
                      close()
                      if let first = sources.first {
                          lastOpenError = "无法读取视频文件：\(first.url.lastPathComponent)"
                      }
                      return
                  }"""
          ss = ss.replace(t_open_fn, r_open_fn, 1)

          t_sec = "\n".join([
            "            let hasSecurityAccess = fileURL.startAccessingSecurityScopedResource()",
            "            let isReadable =",
            "                FileManager.default.fileExists(atPath: fileURL.path)",
            "                    && FileManager.default.isReadableFile(atPath: fileURL.path)",
            "",
            "            guard isReadable else {",
            "                if hasSecurityAccess {",
            "                    fileURL.stopAccessingSecurityScopedResource()",
            "                }",
            "                continue",
            "            }",
            "",
            "            if hasSecurityAccess {",
            "                secured.append(fileURL)",
            "            }",
            "            result.append(source)",
          ])
          assert ss.count(t_sec) == 1, f"unexpected PlayerSessionStore block count: {ss.count(t_sec)}"
          r_sec = "\n".join([
            "            let hasSecurityAccess = fileURL.startAccessingSecurityScopedResource()",
            "            var resolvedURL = fileURL",
            "            var isReadable =",
            "                FileManager.default.fileExists(atPath: resolvedURL.path)",
            "                    && FileManager.default.isReadableFile(atPath: resolvedURL.path)",
            "",
            "            if !isReadable {",
            "                resolvedURL = Self.coordinateReadableURL(fileURL)",
            "                isReadable =",
            "                    FileManager.default.fileExists(atPath: resolvedURL.path)",
            "                        && FileManager.default.isReadableFile(atPath: resolvedURL.path)",
            "            }",
            "",
            "            guard hasSecurityAccess || isReadable else {",
            "                continue",
            "            }",
            "",
            "            if hasSecurityAccess {",
            "                secured.append(fileURL)",
            "            }",
            "            let effectiveSource =",
            "                resolvedURL == fileURL",
            "                    ? source",
            "                    : PlayerSource(url: resolvedURL, startTime: source.startTime)",
            "            result.append(effectiveSource)",
          ])
          ss = ss.replace(t_sec, r_sec, 1)

          t_end = "    private func releaseSecurityScopedURLs() {"
          assert ss.count(t_end) == 1, f"unexpected releaseSecurityScopedURLs count: {ss.count(t_end)}"
          r_end = "\n".join([
            "    nonisolated private static func coordinateReadableURL(_ url: URL) -> URL {",
            "        var resolvedURL = url",
            "        var coordError: NSError?",
            "        NSFileCoordinator().coordinate(readingItemAt: url, options: [], error: &coordError) { newURL in",
            "            resolvedURL = newURL",
            "        }",
            "        return resolvedURL",
            "    }",
            "",
            "    private func releaseSecurityScopedURLs() {",
          ])
          ss = ss.replace(t_end, r_end, 1)
          pss.write_text(ss, encoding="utf-8")
          print("Patched PlayerSessionStore.swift")

          ip = pathlib.Path("CinePlayer/Info.plist")
          with ip.open("rb") as f:
            pl = plistlib.load(f)
          pl["UIFileSharingEnabled"] = True
          with ip.open("wb") as f:
            plistlib.dump(pl, f)
          print("Patched Info.plist UIFileSharingEnabled=True")
          app_path = pathlib.Path("CinePlayer/CinePlayerApp.swift")
          app_txt = app_path.read_text(encoding="utf-8")
          if "import Foundation" not in app_txt:
            app_txt = "import Foundation\n" + app_txt
          t_app = "\n".join([
            "            #else",
            "                .onOpenURL { url in",
            "                    if url.isFileURL {",
            "                        sessionStore.open(url: url)",
            "                    }",
            "                }",
            "            #endif",
          ])
          assert app_txt.count(t_app) == 1, f"unexpected CinePlayerApp.swift block count: {app_txt.count(t_app)}"
          r_app = "\n".join([
            "            #else",
            "                .onOpenURL { url in",
            "                    if url.isFileURL {",
            "                        sessionStore.open(url: url)",
            "                    }",
            "                    #if DEBUG",
            "                    if !url.isFileURL,",
            "                       url.scheme == \"cineplayer\",",
            "                       url.host(percentEncoded: false) == \"smoke\",",
            "                       let components = URLComponents(url: url, resolvingAgainstBaseURL: false),",
            "                       let name = components.queryItems?.first(where: { $0.name == \"file\" })?.value,",
            "                       !name.isEmpty,",
            "                       let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first",
            "                    {",
            "                        let targetURL = docs.appendingPathComponent((name as NSString).lastPathComponent)",
            "                        sessionStore.open(url: targetURL)",
            "                    }",
            "                    #endif",
            "                }",
            "                #if DEBUG",
            "                .task {",
            "                    guard sessionStore.currentSource == nil,",
            "                          let name = UserDefaults.standard.string(forKey: \"smokeFile\"),",
            "                          !name.isEmpty,",
            "                          let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first",
            "                    else { return }",
            "                    try? await Task.sleep(for: .milliseconds(500))",
            "                    let targetURL = docs.appendingPathComponent((name as NSString).lastPathComponent)",
            "                    sessionStore.open(url: targetURL)",
            "                }",
            "                #endif",
            "            #endif",
          ])
          app_path.write_text(app_txt.replace(t_app, r_app, 1), encoding="utf-8")
          print("Patched CinePlayerApp.swift DEBUG cineplayer://smoke hook")
          '

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project CinePlayer.xcodeproj -scheme CinePlayer -skipPackagePluginValidation -skipMacroValidation

      - name: Run iOS Simulator smoke test (launch & open local video)
        run: |
          set -euo pipefail
          mkdir -p sim-smoke-report

          {
            echo "=== Frameworks/*.xcframework ==="
            ls -la Frameworks/*.xcframework || true
            echo "=== CinePlayerSDK.xcframework/Info.plist ==="
            cat Frameworks/CinePlayerSDK.xcframework/Info.plist || true
          } > sim-smoke-report/arch.log 2>&1

          HAS_SIM_SLICE=$(python3 -c '
          import glob, os, plistlib
          p = "Frameworks/CinePlayerSDK.xcframework/Info.plist"
          found = False
          if os.path.exists(p):
              with open(p, "rb") as f:
                  pl = plistlib.load(f)
              for item in pl.get("AvailableLibraries", []):
                  if item.get("SupportedPlatformVariant") == "simulator" or "simulator" in item.get("LibraryIdentifier", "").lower():
                      found = True
                      break
          if not found and glob.glob("Frameworks/CinePlayerSDK.xcframework/*simulator*"):
              found = True
          print("1" if found else "0")
          ')

          if [ "$HAS_SIM_SLICE" != "1" ]; then
            echo "CinePlayerSDK.xcframework has no iOS Simulator slice; skipping simulator smoke test." | tee sim-smoke-report/launch.log sim-smoke-report/process.log
            echo "::warning::CinePlayerSDK.xcframework has no iOS Simulator slice; skipping simulator smoke test"
            exit 0
          fi

          SIM_UDID=$(python3 -c '
          import json, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devs in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              rt_nums = [int(x) for x in re.findall(r"\d+", runtime)]
              for d in devs:
                  name = d.get("name", "")
                  if d.get("isAvailable") and "iPhone" in name:
                      dev_nums = [int(x) for x in re.findall(r"\d+", name)]
                      score = (rt_nums, dev_nums, 1 if "Pro" in name else 0, name)
                      candidates.append((score, d["udid"], name, runtime))
          candidates.sort(reverse=True)
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          best = candidates[0]
          print(f"Selected simulator: {best[2]} ({best[3]}) UDID={best[1]}", file=sys.stderr)
          print(best[1])
          ')

          xcodebuild \
            -project CinePlayer.xcodeproj \
            -scheme CinePlayer \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build \
            SYMROOT="$PWD/build-sim"

          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          APP_PATH="build-sim/Debug-iphonesimulator/CinePlayer.app"
          test -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID" | tee sim-smoke-report/launch.log

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" >> sim-smoke-report/launch.log 2>&1
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot sim-smoke-report/sim-01-launch.png

          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=30 -t 10 -c:v libx264 -pix_fmt yuv420p smoke.mp4
          else
            swift - <<'SWIFT'
          import AVFoundation
          import CoreMedia
          import CoreVideo
          import Dispatch
          import Foundation

          let outURL = URL(fileURLWithPath: FileManager.default.currentDirectoryPath).appendingPathComponent("smoke.mp4")
          try? FileManager.default.removeItem(at: outURL)
          let writer = try AVAssetWriter(outputURL: outURL, fileType: .mp4)
          let settings: [String: Any] = [
              AVVideoCodecKey: AVVideoCodecType.h264,
              AVVideoWidthKey: 320,
              AVVideoHeightKey: 240,
          ]
          let input = AVAssetWriterInput(mediaType: .video, outputSettings: settings)
          let adaptor = AVAssetWriterInputPixelBufferAdaptor(
              assetWriterInput: input,
              sourcePixelBufferAttributes: [
                  kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32ARGB,
                  kCVPixelBufferWidthKey as String: 320,
                  kCVPixelBufferHeightKey as String: 240,
              ]
          )
          writer.add(input)
          writer.startWriting()
          writer.startSession(atSourceTime: .zero)
          for frame in 0..<150 {
              while !input.isReadyForMoreMediaData { Thread.sleep(forTimeInterval: 0.005) }
              var pb: CVPixelBuffer?
              CVPixelBufferCreate(kCFAllocatorDefault, 320, 240, kCVPixelFormatType_32ARGB, nil, &pb)
              if let pb {
                  CVPixelBufferLockBaseAddress(pb, [])
                  if let base = CVPixelBufferGetBaseAddress(pb) {
                      let bytes = base.assumingMemoryBound(to: UInt8.self)
                      let bpr = CVPixelBufferGetBytesPerRow(pb)
                      for y in 0..<240 {
                          for x in 0..<320 {
                              let off = y * bpr + x * 4
                              bytes[off] = 255
                              bytes[off + 1] = UInt8((x + frame * 4) % 256)
                              bytes[off + 2] = UInt8((y + frame * 2) % 256)
                              bytes[off + 3] = 180
                          }
                      }
                  }
                  CVPixelBufferUnlockBaseAddress(pb, [])
                  adaptor.append(pb, withPresentationTime: CMTime(value: Int64(frame), timescale: 15))
              }
          }
          input.markAsFinished()
          let sem = DispatchSemaphore(value: 0)
          writer.finishWriting { sem.signal() }
          sem.wait()
          guard writer.status == .completed else {
              fatalError("AVAssetWriter failed: \(String(describing: writer.error))")
          }
          print("Generated smoke.mp4 via AVAssetWriter")
          SWIFT
          fi

          DATA_DIR=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data)
          mkdir -p "$DATA_DIR/Documents"
          cp smoke.mp4 "$DATA_DIR/Documents/smoke.mp4"
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -smokeFile smoke.mp4 > sim-smoke-report/openurl.log 2>&1
          sleep 6
          xcrun simctl io "$SIM_UDID" screenshot sim-smoke-report/sim-02-open-local-video.png

          xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --predicate 'process == "CinePlayer"' 2>&1 | tail -n 200 > sim-smoke-report/app.log || true

          {
            echo "=== simctl launchctl list ==="
            xcrun simctl spawn "$SIM_UDID" launchctl list | grep -i cineplayer || true
            echo "=== pgrep -fl CinePlayer ==="
            pgrep -fl CinePlayer || true
            echo "=== ps aux CinePlayer ==="
            ps aux | grep -i "[C]inePlayer" || true
            echo "=== DiagnosticReports ==="
            ls -la ~/Library/Logs/DiagnosticReports/*CinePlayer* 2>/dev/null || true
          } > sim-smoke-report/process.log 2>&1
          cp ~/Library/Logs/DiagnosticReports/*CinePlayer* sim-smoke-report/ 2>/dev/null || true

          if ! pgrep -f "CinePlayer.app/CinePlayer" >/dev/null 2>&1; then
            echo "CinePlayer process is not running after smoke test!" | tee -a sim-smoke-report/process.log
            exit 1
          fi

      - name: Upload Simulator smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CinePlayer-sim-smoke-report
          path: sim-smoke-report
          retention-days: 30

      - name: Build unsigned Release iOS app
        run: |
          xcodebuild \
            -project CinePlayer.xcodeproj \
            -scheme CinePlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT="$PWD/build"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CinePlayer.app Payload/
          ls -la Payload/CinePlayer.app/Frameworks || true
          zip -qry "CinePlayer-v1.0.1-b${{ github.run_number }}-unsigned.ipa" Payload
          ls -lh CinePlayer-v1.0.1-b*-unsigned.ipa

      - name: Upload CinePlayer-unsigned-ipa
        uses: actions/upload-artifact@v4
        with:
          name: CinePlayer-unsigned-ipa
          path: CinePlayer-v*-unsigned.ipa
          retention-days: 30
